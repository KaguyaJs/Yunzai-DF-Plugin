  chuoTips: |-
    戳一戳开关
  chuo: true
  modeTips: |-
    戳一戳模式
    image: 返回图片消息
    text: 返回文本消息
    random: 随机返回文本或图片
    mix: 同时显示图片+文字
  mode: image
  imageApiTips: |-
    戳一戳Api地址, 无特殊情况不需要填写
  imageApi: ""
  imageTypeTips: |-
    戳一戳图片设置
    1: 柴郡
    2: 丛雨
    3: 诗歌剧 
    4: 柚子厨 
    5: 小南梁
    6: 小鲨鱼古拉
    7: 甘城猫猫
    8: 龙图
    9: 满穗
    10: 猫猫虫
    11: 纳西妲
    12: 心海
    13: fufu
    14: ATRI
    15: 绫地宁宁
    16: 永雏塔菲
    17: miku
    18: 特蕾西娅
    19: doro
    20: 米塔
    0: 自定义图片 (自行在resources/poke/default中添加)
    all: 随机类型
  imageType: 1
  imageBlackTips: |-
    戳一戳随机图片黑名单
  imageBlack:
