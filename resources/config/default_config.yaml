# 此配置文件为系统使用，请勿修改，否则可能无法正常使用
# 用户配置已移动至 Yz/config/DF-Plugin.yaml

# Git仓库更新推送
CodeUpdate:
  AutoTips: |-
    自动检查仓库更新开关
  Auto: false
  RequestEstimateLogTips: |-
    是否输出仓库请求统计日志，默认开启
    仅控制估算日志，不影响自动检查和仓库更新推送
  RequestEstimateLog: true
  CronTips: |-
    仓库更新检查Cron表达式
    Github/Gitee Api 未认证用户每小时限制60 (ip限制), 认证用户每小时限制5000次 (账号限制)
  Cron: "0 */30 * * * *"
  FirstAddTips: |-
    首次添加仓库(数据库不存在数据库)是否进行一次推送
  FirstAdd: false
  badgeStyleTips: |-
    提交信息中是否启用徽章样式
  badgeStyle: true
  ThemeTips: |-
    仓库更新图片主题，自动推送与手动汇总共用，默认使用海盐蓝，经典原版可自行选择
    Name: classic经典原版、dark深空、light晨光、ocean海盐蓝、forest松石绿、sunset暖砂橙、lavender薰衣草、pink樱花粉
    Accent: 强调色；Background: 图片背景；Surface: 卡片背景；Text: 主文字；Muted: 辅助文字；Border: 边框
    颜色留空跟随所选主题，支持#RGB或#RRGGBB格式；切换主题后已填写的颜色仍会覆盖预设
    自定义颜色、宽度和圆角仅对新主题生效；经典原版保持原始外观，切回时保留自定义设置供下次选择新主题使用
    Width: 布局宽度（520-1000像素），最终图片还会应用渲染精度缩放
    Radius: 卡片圆角（0-28像素），0为直角
  Theme:
    Name: ocean
    Accent: ""
    Background: ""
    Surface: ""
    Text: ""
    Muted: ""
    Border: ""
    Width: 640
    Radius: 16
  TranslateTips: |-
    是否在渲染Git仓库更新推送前，将提交信息和Release内容翻译为简体中文
    默认使用Google公共翻译接口，如网络无法访问可开启代理或修改TranslateApi
  Translate: false
  TranslateApiTips: |-
    翻译接口地址
    默认兼容Google公共翻译接口
    也支持包含 {text} / {q} / {target} 占位符的GET接口模板
  TranslateApi: "https://translate.googleapis.com/translate_a/single"
  TranslateNameTips: |-
    翻译后在推送图片中显示的提示名称
  TranslateName: "Google 翻译"
  multiPageTips: |-
    自动推送与手动推送仓库更新达到多少条时分片截图，填 -1 关闭
    手动推送先汇总全部推送组，所有图片分片在同一次回复中发送
  multiPage: 12
  ReleaseTips: |-
    Release附件展示设置
    ShowAssets: 在推送图片中展示附件名称和大小
    AssetLimit: 最多展开的附件数量，超出后显示折叠数量；0折叠全部，-1展示全部
    草稿通过仓库条目的includeDrafts开启，默认忽略；接口认证账号需有读取草稿的权限
  Release:
    ShowAssets: true
    AssetLimit: 5
  ActivityTips: |-
    PR/Issue推送设置（GitHub、Gitee、Gitcode及Gitea兼容接口）；分页和批次上限也用于提交
    PageSize: 提交/PR/Issue每页获取数量（1-100）
    MaxPages: 单次最多获取页数；达到上限且尚未确认完整时保留检查进度，需调高后重试；CNB提交父链节点预算为PageSize×MaxPages
    InitialLimit: PR/Issue首次推送与手动预览的每仓库条目上限
    BatchSize: 自动推送包含提交/PR/Issue时每条消息的条目上限；手动预览汇总后一次回复，仍按multiPage决定是否分片
    BodyLimit: 正文/评论摘要最大字符数，0为隐藏正文
    OverlapSeconds: 增量查询回看秒数，避免时间边界遗漏
    SendLinks: PR/Issue图片后附可点击的原始链接
    ShowDiff: 在PR卡片中展示代码diff，默认关闭；不用于评论通知
    DiffMaxFiles: 展开diff最多包含的文件数，超过后自动收起为文件摘要
    DiffMaxLines: 展开diff最多显示的总行数（含上下文），超过后自动收起
  Activity:
    PageSize: 100
    MaxPages: 20
    InitialLimit: 10
    BatchSize: 20
    BodyLimit: 600
    OverlapSeconds: 60
    SendLinks: false
    ShowDiff: false
    DiffMaxFiles: 3
    DiffMaxLines: 40
  timeFormatTips: |-
    时间格式
    1: 多久之前 x分钟前 X小时前
    2: 日期加时间 2023-01-01 00:00:00
    3: 自适应时分（非当日显示日期） 2023-01-01 00:00
  timeFormat: 1
  RepoTips: |-
    GitApi配置
      provider: 仓库提供商，唯一标识符
      token: 认证Token
      ApiUrl: Api地址
  repos:
    - provider: "GitHub"
      token: ""
      ApiUrl: "https://api.github.com/repos"
      icon: "GitHub"
      tips: Github个人Token 获取地址 https://github.com/settings/tokens
    - provider: "Gitee"
      token: ""
      ApiUrl: "https://gitee.com/api/v5/repos"
      icon: "Gitee"
      tips: Gitee个人Token 获取地址 https://gitee.com/profile/personal_access_tokens
    - provider: "Gitcode"
      token: ""
      ApiUrl: "https://gitcode.com/api/v5/repos"
      icon: "Gitcode"
      tips: Gitcode个人Token 获取地址 https://gitcode.com/setting/token-classic
    - provider: "CNB"
      token: ""
      ApiUrl: "https://api.cnb.cool"
      icon: "CNB"

  ListTips: |-
    推送配置
    Group: 推送的群聊列表
    QQ: 推送的QQ列表
    AutoPath: 是否自动获取已安装的插件地址并监听
    Exclude: 排除的仓库路径(用于忽略一些不希望被监听的插件)
    repos: 
        provider: 仓库提供商，唯一标识符
        repo: 仓库名
        branch: 分支数组，仅commits生效；[]自动获取默认分支，[main, dev]监听多个分支，[all]每次获取并监听所有分支
        type: 监听类型数组，可同时选择commits、releases、pulls（PR）、issues，例如[commits, pulls, issues]
        events: 监听事件，留空使用新建/关闭/重开，PR另含合并/转为正式
        labels / excludeLabels: 包含任一指定标签 / 排除标签
        authors / excludeAuthors: 作者账号筛选（评论按评论作者）
        excludeBots: 忽略机器人，默认true
        includeDrafts: 包含草稿PR和最新草稿Release，默认false；草稿Release修改及转为正式会触发推送，需要有读取草稿权限的认证Token
        baseBranches: PR目标分支，留空监听全部
    note: 备注
  List: []

# 戳一戳配置
